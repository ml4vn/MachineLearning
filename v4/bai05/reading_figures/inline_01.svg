<svg class="evidence" xmlns="http://www.w3.org/2000/svg" viewbox="0 0 1740 210"><style><![CDATA[*{box-sizing:border-box}body{font:19px/1.7 "Segoe UI",Arial,sans-serif;color:#132c3f;max-width:1160px;margin:36px auto;padding:0 24px}h1,h2,h3{color:#245a84}h2{border-top:3px solid #167a72;padding-top:16px;margin-top:36px}table{border-collapse:collapse;width:100%;margin:22px 0;font-size:18px}th,td{border-bottom:1px solid #c5d5dc;padding:12px;text-align:left;vertical-align:top;overflow-wrap:anywhere}th{background:#e4edf1}tr:nth-child(even){background:#f0f5f7}a{color:#245a84;overflow-wrap:anywhere}pre{background:#eef4f7;padding:18px;white-space:pre-wrap;overflow-wrap:anywhere}code{font-family:Consolas,monospace}strong{color:#167a72}.note{border-left:4px solid #bc761a;padding:12px 18px;background:#fcf6ec}img{max-width:100%}.wrap{overflow-x:auto}p,li{overflow-wrap:anywhere}.evidence{display:block;width:100%;height:auto}.equation{text-align:center;font-size:22px;margin:24px 0;overflow-x:auto}details{margin:20px 0;padding:15px;background:#f0f5f7}summary{cursor:pointer;color:#167a72;font-weight:600}@media(max-width:650px){body{font-size:17px;padding:0 16px}.wrap table{min-width:560px}h1{font-size:28px}}@media print{body{max-width:none;margin:0;font-size:12pt}details>*{display:block}h2{break-after:avoid}table,img{break-inside:avoid}}]]></style><line x1="100" y1="75" x2="1660" y2="75" stroke="#627886" stroke-width="3"></line><circle cx="200" cy="75" r="11" fill="#167a72"></circle><text x="110" y="40" fill="#167a72" font-family="BVP" font-size="30" font-weight="600">Duyệt đơn</text><circle cx="870" cy="75" r="11" fill="#245a84"></circle><text x="780" y="40" fill="#245a84" font-family="BVP" font-size="30" font-weight="600">Ngày hẹn</text><circle cx="1500" cy="75" r="11" fill="#bc761a"></circle><text x="1410" y="40" fill="#bc761a" font-family="BVP" font-size="30" font-weight="600">Giao thực tế</text><text x="95" y="133" fill="#167a72" font-family="BVP" font-size="29" font-weight="400">Đọc đầu vào → dự đoán p</text><text x="1160" y="133" fill="#bc761a" font-family="BVP" font-size="29" font-weight="400">Có kết quả → tạo nhãn y</text><text x="95" y="182" fill="#627886" font-family="BVP" font-size="27" font-weight="400">Metadata tĩnh: giả định sẵn có tại duyệt; ngày giao thuộc tương lai.</text></svg>