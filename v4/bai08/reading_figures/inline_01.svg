<svg class="evidence" xmlns="http://www.w3.org/2000/svg" viewbox="0 0 820 430"><style><![CDATA[*{box-sizing:border-box}body{font:19px/1.7 "Segoe UI",Arial,sans-serif;color:#132c3f;max-width:1160px;margin:36px auto;padding:0 24px}h1,h2,h3{color:#245a84}h2{border-top:3px solid #167a72;padding-top:16px;margin-top:36px}table{border-collapse:collapse;width:100%;margin:22px 0;font-size:18px}th,td{border-bottom:1px solid #c5d5dc;padding:12px;text-align:left;vertical-align:top;overflow-wrap:anywhere}th{background:#e4edf1}tr:nth-child(even){background:#f0f5f7}a{color:#245a84;overflow-wrap:anywhere}pre{background:#eef4f7;padding:18px;white-space:pre-wrap;overflow-wrap:anywhere}code{font-family:Consolas,monospace}strong{color:#167a72}.note{border-left:4px solid #bc761a;padding:12px 18px;background:#fcf6ec}img{max-width:100%;height:auto}.wrap{overflow-x:auto}p,li{overflow-wrap:anywhere}.evidence{display:block;width:100%;height:auto}.equation{text-align:center;font-size:22px;margin:24px 0;overflow-x:auto}details{margin:20px 0;padding:15px;background:#f0f5f7}summary{cursor:pointer;color:#167a72;font-weight:600}button,input,select{font:inherit;padding:8px 12px;max-width:100%}.controls{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin:18px 0}#slideimg{border:1px solid #c5d5dc}#notes{background:#f0f5f7;padding:20px;white-space:pre-line;overflow-wrap:anywhere}svg text{font-family:"Segoe UI",Arial,sans-serif}@media(max-width:650px){body{font-size:17px;padding:0 16px}.wrap table{min-width:560px}h1{font-size:28px}}@media print{body{max-width:none;margin:0;font-size:12pt}details>*{display:block}h2{break-after:avoid}table,img{break-inside:avoid}}]]></style><text x="85" y="45" fill="#245a84" font-size="31" font-family="BVP,Arial" font-weight="700">1. Giao dịch và RFM</text><line x1="42" y1="50" x2="42" y2="99" stroke="#167a72" stroke-width="3"></line><polygon points="42,99 37.6503446588877,89.99552897647322 46.3496553411123,89.99552897647322" fill="#167a72"></polygon><text x="85" y="122" fill="#bc761a" font-size="31" font-family="BVP,Arial" font-weight="700">2. Biểu diễn và khoảng cách</text><line x1="42" y1="127" x2="42" y2="176" stroke="#167a72" stroke-width="3"></line><polygon points="42,176 37.6503446588877,166.99552897647322 46.3496553411123,166.99552897647322" fill="#167a72"></polygon><text x="85" y="199" fill="#167a72" font-size="31" font-family="BVP,Arial" font-weight="700">3. Gán, cập nhật và J</text><line x1="42" y1="204" x2="42" y2="253" stroke="#167a72" stroke-width="3"></line><polygon points="42,253 37.6503446588877,243.99552897647322 46.3496553411123,243.99552897647322" fill="#167a72"></polygon><text x="85" y="276" fill="#795aa4" font-size="31" font-family="BVP,Arial" font-weight="700">4. Khởi tạo và chọn K</text><line x1="42" y1="281" x2="42" y2="330" stroke="#167a72" stroke-width="3"></line><polygon points="42,330 37.6503446588877,320.9955289764732 46.3496553411123,320.9955289764732" fill="#167a72"></polygon><text x="85" y="353" fill="#245a84" font-size="31" font-family="BVP,Arial" font-weight="700">5. Hồ sơ và kiểm chứng</text></svg>