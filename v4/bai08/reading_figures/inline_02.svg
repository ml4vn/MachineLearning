<svg class="evidence" xmlns="http://www.w3.org/2000/svg" viewbox="0 0 1740 210"><style><![CDATA[*{box-sizing:border-box}body{font:19px/1.7 "Segoe UI",Arial,sans-serif;color:#132c3f;max-width:1160px;margin:36px auto;padding:0 24px}h1,h2,h3{color:#245a84}h2{border-top:3px solid #167a72;padding-top:16px;margin-top:36px}table{border-collapse:collapse;width:100%;margin:22px 0;font-size:18px}th,td{border-bottom:1px solid #c5d5dc;padding:12px;text-align:left;vertical-align:top;overflow-wrap:anywhere}th{background:#e4edf1}tr:nth-child(even){background:#f0f5f7}a{color:#245a84;overflow-wrap:anywhere}pre{background:#eef4f7;padding:18px;white-space:pre-wrap;overflow-wrap:anywhere}code{font-family:Consolas,monospace}strong{color:#167a72}.note{border-left:4px solid #bc761a;padding:12px 18px;background:#fcf6ec}img{max-width:100%;height:auto}.wrap{overflow-x:auto}p,li{overflow-wrap:anywhere}.evidence{display:block;width:100%;height:auto}.equation{text-align:center;font-size:22px;margin:24px 0;overflow-x:auto}details{margin:20px 0;padding:15px;background:#f0f5f7}summary{cursor:pointer;color:#167a72;font-weight:600}button,input,select{font:inherit;padding:8px 12px;max-width:100%}.controls{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin:18px 0}#slideimg{border:1px solid #c5d5dc}#notes{background:#f0f5f7;padding:20px;white-space:pre-line;overflow-wrap:anywhere}svg text{font-family:"Segoe UI",Arial,sans-serif}@media(max-width:650px){body{font-size:17px;padding:0 16px}.wrap table{min-width:560px}h1{font-size:28px}}@media print{body{max-width:none;margin:0;font-size:12pt}details>*{display:block}h2{break-after:avoid}table,img{break-inside:avoid}}]]></style><line x1="60" y1="85" x2="1670" y2="85" stroke="#627886" stroke-width="3"></line><polygon points="1670,85 1660.9955289764732,89.3496553411123 1660.9955289764732,80.6503446588877" fill="#627886"></polygon><circle cx="70" cy="85" r="9" fill="#245a84" stroke="#f8fafb" stroke-width="1.5"></circle><text x="10" y="137" fill="#13