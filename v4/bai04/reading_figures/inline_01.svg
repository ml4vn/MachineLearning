<svg class="evidence" xmlns="http://www.w3.org/2000/svg" viewbox="0 0 1740 350"><style><![CDATA[*{box-sizing:border-box}body{font:19px/1.7 "Segoe UI",Arial,sans-serif;color:#132c3f;max-width:1160px;margin:36px auto;padding:0 24px}h1,h2,h3{color:#245a84}h2{border-top:3px solid #167a72;padding-top:16px;margin-top:36px}table{border-collapse:collapse;width:100%;margin:22px 0;font-size:18px}th,td{border-bottom:1px solid #c5d5dc;padding:12px;text-align:left;vertical-align:top;overflow-wrap:anywhere}th{background:#e4edf1}tr:nth-child(even){background:#f0f5f7}a{color:#245a84;overflow-wrap:anywhere}pre{background:#eef4f7;padding:18px;white-space:pre-wrap;overflow-wrap:anywhere}code{font-family:Consolas,monospace}strong{color:#167a72}.note{border-left:4px solid #bc761a;padding:12px 18px;background:#fcf6ec}img{max-width:100%}.wrap{overflow-x:auto}p,li{overflow-wrap:anywhere}.evidence{display:block;width:100%;height:auto}.equation{text-align:center;font-size:22px;margin:24px 0;overflow-x:auto}details{margin:20px 0;padding:15px;background:#f0f5f7}summary{cursor:pointer;color:#167a72;font-weight:600}@media(max-width:650px){body{font-size:17px;padding:0 16px}.wrap table{min-width:560px}h1{font-size:28px}}@media print{body{max-width:none;margin:0;font-size:12pt}details>*{display:block}h2{break-after:avoid}table,img{break-inside:avoid}}]]></style><line x1="110" y1="130" x2="1620" y2="130" stroke="#627886" stroke-width="3"></line><circle cx="180" cy="130" r="12" fill="#627886"></circle><text x="95" y="85" fill="#627886" font-family="BVP" font-size="32" font-weight="600">Đặt hàng</text><circle cx="770" cy="130" r="12" fill="#167a72"></circle><text x="685" y="85" fill="#167a72" font-family="BVP" font-size="32" font-weight="600">Phê duyệt</text><circle cx="1510" cy="130" r="12" fill="#bc761a"></circle><text x="1425" y="85" fill="#bc761a" font-family="BVP" font-size="32" font-weight="600">Giao thực tế</text><line x1="790" y1="190" x2="1490" y2="190" stroke="#bc761a" stroke-width="4"></line><polygon points="1490,190 1477,196 1477,184" fill="#bc761a"></polygon><text x="930" y="240" fill="#bc761a" font-family="BVP" font-size="31" font-weight="400">Δt: dùng để tạo nhãn sau khi giao</text><text x="650" y="315" fill="#167a72" font-family="BVP" font-size="31" font-weight="400">Mốc dự đoán: chỉ đọc đầu vào đã biết</text></svg>