<svg class="evidence" xmlns="http://www.w3.org/2000/svg" viewbox="0 0 1740 270"><style><![CDATA[*{box-sizing:border-box}body{font:19px/1.7 "Segoe UI",Arial,sans-serif;color:#132c3f;max-width:1160px;margin:36px auto;padding:0 24px}h1,h2,h3{color:#245a84}h2{border-top:3px solid #167a72;padding-top:16px;margin-top:36px}table{border-collapse:collapse;width:100%;margin:22px 0;font-size:18px}th,td{border-bottom:1px solid #c5d5dc;padding:12px;text-align:left;vertical-align:top;overflow-wrap:anywhere}th{background:#e4edf1}tr:nth-child(even){background:#f0f5f7}a{color:#245a84;overflow-wrap:anywhere}pre{background:#eef4f7;padding:18px;white-space:pre-wrap;overflow-wrap:anywhere}code{font-family:Consolas,monospace}strong{color:#167a72}.note{border-left:4px solid #bc761a;padding:12px 18px;background:#fcf6ec}img{max-width:100%}.wrap{overflow-x:auto}p,li{overflow-wrap:anywhere}.evidence{display:block;width:100%;height:auto}.equation{text-align:center;font-size:22px;margin:24px 0;overflow-x:auto}details{margin:20px 0;padding:15px;background:#f0f5f7}summary{cursor:pointer;color:#167a72;font-weight:600}@media(max-width:650px){body{font-size:17px;padding:0 16px}.wrap table{min-width:560px}h1{font-size:28px}}@media print{body{max-width:none;margin:0;font-size:12pt}details>*{display:block}h2{break-after:avoid}table,img{break-inside:avoid}}]]></style><text x="25" y="48" fill="#245a84" font-family="BVP" font-size="32" font-weight="600">Trạng thái cũ (w,b)=(0,5;1)</text><text x="25" y="110" fill="#627886" font-family="BVP" font-size="29" font-weight="400">Cùng residual: [−1,5;−2;−3,5;−4]</text><line x1="625" y1="95" x2="820" y2="95" stroke="#627886" stroke-width="4"></line><polygon points="820,95 807,101 807,89" fill="#627886"></polygon><text x="890" y="45" fill="#245a84" font-family="BVP" font-size="31" font-weight="600">g_w=−8</text><text x="890" y="132" fill="#245a84" font-family="BVP" font-size="31" font-weight="600">g_b=−2,75</text><line x1="1080" y1="39" x2="1285" y2="39" stroke="#bc761a" stroke-width="4"></line><polygon points="1285,39 1272,45 1272,33" fill="#bc761a"></polygon><line x1="1080" y1="129" x2="1285" y2="129" stroke="#bc761a" stroke-width="4"></line><polygon points="1285,129 1272,135 1272,123" fill="#bc761a"></polygon><text x="1330" y="48" fill="#bc761a" font-family="BVP" font-size="31" font-weight="600">w_next=0,9</text><text x="1330" y="139" fill="#bc761a" font-family="BVP" font-size="31" font-weight="600">b_next=1,1375</text><line x1="1300" y1="180" x2="1650" y2="180" stroke="#167a72" stroke-width="3"></line><text x="1300" y="225" fill="#167a72" font-family="BVP" font-size="29" font-weight="600">Gán cả hai → trạng thái mới</text></svg>