<!doctype html><html lang="vi"><head><meta charset="utf-8"><title>Quy tắc dây chuyền: nhân trên một đường</title><link rel="stylesheet" href="../theme.css"><link rel="stylesheet" href="../assets/katex/dist/katex.min.css"><script src="../assets/katex/dist/katex.min.js"></script></head><body><main class="slide normal s38"><div class="meta">BÀI 10 V4 · CHẶNG 3/5</div><h1>Quy tắc dây chuyền: nhân trên một đường</h1><p class="essence">Nhân các đạo hàm cục bộ dọc một đường ảnh hưởng.</p><div class="content"><figure data-science-diagram="elementary_backward"><svg class="evidence" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1740 350"><rect x="70" y="70" width="280" height="100" fill="#f8fafb" stroke="#167a72" stroke-width="2"/><text x="98" y="112" fill="#132c3f" font-size="35" font-family="BVP,Arial" font-weight="700" >t</text><text x="98" y="150" fill="#167a72" font-size="32" font-family="BVP,Arial" font-weight="400" >1</text><line x1="350" y1="120" x2="462" y2="120" stroke="#167a72" stroke-width="3"/><polygon points="462,120 450.12984377594,125.3008858897744 450.12984377594,114.6991141102256" fill="#167a72"/><rect x="480" y="70" width="280" height="100" fill="#f8fafb" stroke="#167a72" stroke-width="2"/><text x="508" y="112" fill="#132c3f" font-size="35" font-family="BVP,Arial" font-weight="700" >u=2t</text><text x="508" y="150" fill="#167a72" font-size="32" font-family="BVP,Arial" font-weight="400" >2</text><line x1="760" y1="120" x2="872" y2="120" stroke="#167a72" stroke-width="3"/><polygon points="872,120 860.12984377594,125.3008858897744 860.12984377594,114.6991141102256" fill="#167a72"/><rect x="890" y="70" width="280" height="100" fill="#f8fafb" stroke="#167a72" stroke-width="2"/><text x="918" y="112" fill="#132c3f" font-size="35" font-family="BVP,Arial" font-weight="700" >v=u+3</text><text x="918" y="150" fill="#167a72" font-size="32" font-family="BVP,Arial" font-weight="400" >5</text><line x1="1170" y1="120" x2="1282" y2="120" stroke="#167a72" stroke-width="3"/><polygon points="1282,120 1270.12984377594,125.3008858897744 1270.12984377594,114.6991141102256" fill="#167a72"/><rect x="1300" y="70" width="280" height="100" fill="#f8fafb" stroke="#167a72" stroke-width="2"/><text x="1328" y="112" fill="#132c3f" font-size="35" font-family="BVP,Arial" font-weight="700" >F=v²</text><text x="1328" y="150" fill="#167a72" font-size="32" font-family="BVP,Arial" font-weight="400" >25</text><line x1="1455" y1="235" x2="210" y2="235" stroke="#bc761a" stroke-width="4"/><polygon points="210,235 221.87015622406,229.6991141102256 221.87015622406,240.3008858897744" fill="#bc761a"/><text x="70" y="315" fill="#bc761a" font-size="32" font-family="BVP,Arial" font-weight="700" >du/dt = 2</text><text x="480" y="315" fill="#bc761a" font-size="32" font-family="BVP,Arial" font-weight="700" >dv/du = 1</text><text x="980" y="315" fill="#bc761a" font-size="32" font-family="BVP,Arial" font-weight="700" >dF/dv = 10</text></svg></figure><div class="equation"><span data-tex="\frac{dF}{dt}=\frac{dF}{dv}\frac{dv}{du}\frac{du}{dt}=10\times1\times2=20"></span></div><p class="takeaway">Mỗi đoạn nói đầu ra của phép toán ấy nhạy bao nhiêu với đầu vào của nó.</p></div><footer class="foot"><span>Bài 10 · MLP và học biểu diễn</span><span>PGS.TS. Nguyễn Văn Hậu</span><span>38 / 87</span></footer></main><script>window.mathErrors=[];document.querySelectorAll("[data-tex]").forEach(e=>{try{katex.render(e.dataset.tex,e,{throwOnError:true})}catch(x){window.mathErrors.push(String(x))}})</script></body></html>
