<!doctype html><html lang="vi"><head><meta charset="utf-8"><title>Batch và epoch trong thí nghiệm ảnh</title><link rel="stylesheet" href="../theme.css"><link rel="stylesheet" href="../assets/katex/dist/katex.min.css"><script src="../assets/katex/dist/katex.min.js"></script></head><body><main class="slide normal s66"><div class="meta">BÀI 10 V4 · CHẶNG 4/5</div><h1>Batch và epoch trong thí nghiệm ảnh</h1><p class="essence">Phân biệt một bước cập nhật với một lượt qua toàn bộ train.</p><div class="content"><figure data-science-diagram="batch_epoch"><svg class="evidence" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1740 295"><text x="20" y="45" fill="#132c3f" font-size="36" font-family="BVP,Arial" font-weight="700" >Một epoch: đi qua 12.000 ảnh train</text><rect x="20" y="95" width="120" height="85" fill="#245a84" stroke="none" stroke-width="0"/><text x="35" y="148" fill="#f8fafb" font-size="32" font-family="BVP,Arial" font-weight="700" >256</text><rect x="170" y="95" width="120" height="85" fill="#245a84" stroke="none" stroke-width="0"/><text x="185" y="148" fill="#f8fafb" font-size="32" font-family="BVP,Arial" font-weight="700" >256</text><rect x="320" y="95" width="120" height="85" fill="#245a84" stroke="none" stroke-width="0"/><text x="335" y="148" fill="#f8fafb" font-size="32" font-family="BVP,Arial" font-weight="700" >256</text><rect x="470" y="95" width="120" height="85" fill="#245a84" stroke="none" stroke-width="0"/><text x="485" y="148" fill="#f8fafb" font-size="32" font-family="BVP,Arial" font-weight="700" >256</text><rect x="620" y="95" width="120" height="85" fill="#245a84" stroke="none" stroke-width="0"/><text x="635" y="148" fill="#f8fafb" font-size="32" font-family="BVP,Arial" font-weight="700" >256</text><rect x="770" y="95" width="120" height="85" fill="#245a84" stroke="none" stroke-width="0"/><text x="785" y="148" fill="#f8fafb" font-size="32" font-family="BVP,Arial" font-weight="700" >256</text><rect x="920" y="95" width="120" height="85" fill="#245a84" stroke="none" stroke-width="0"/><text x="935" y="148" fill="#f8fafb" font-size="32" font-family="BVP,Arial" font-weight="700" >256</text><rect x="1070" y="95" width="120" height="85" fill="#245a84" stroke="none" stroke-width="0"/><text x="1085" y="148" fill="#f8fafb" font-size="32" font-family="BVP,Arial" font-weight="700" >256</text><rect x="1220" y="95" width="120" height="85" fill="#245a84" stroke="none" stroke-width="0"/><text x="1235" y="148" fill="#f8fafb" font-size="32" font-family="BVP,Arial" font-weight="700" >256</text><rect x="1370" y="95" width="120" height="85" fill="#245a84" stroke="none" stroke-width="0"/><text x="1385" y="148" fill="#f8fafb" font-size="32" font-family="BVP,Arial" font-weight="700" >…</text><rect x="1530" y="95" width="180" height="85" fill="#bc761a" stroke="none" stroke-width="0"/><text x="1555" y="148" fill="#f8fafb" font-size="32" font-family="BVP,Arial" font-weight="700" >224</text><text x="20" y="257" fill="#627886" font-size="33" font-family="BVP,Arial" font-weight="400" >46 batch đủ kích thước + 1 batch cuối nhỏ hơn = 47 cập nhật</text></svg></figure><div class="equation"><span data-tex="\lceil12000/256\rceil=47\ \text{batch/epoch}"></span></div><p>46 batch đủ 256 ảnh và một batch cuối 224 ảnh.<br>Mỗi batch tạo một cập nhật. Một epoch đi qua toàn bộ train một lần.</p></div><footer class="foot"><span>Bài 10 · MLP và học biểu diễn</span><span>PGS.TS. Nguyễn Văn Hậu</span><span>66 / 87</span></footer></main><script>window.mathErrors=[];document.querySelectorAll("[data-tex]").forEach(e=>{try{katex.render(e.dataset.tex,e,{throwOnError:true})}catch(x){window.mathErrors.push(String(x))}})</script></body></html>
