dth="2"/><text x="435" y="202" fill="#132c3f" font-size="34" font-family="BVP,Arial" font-weight="700" >x₁+x₂−1</text><line x1="735" y1="190" x2="855" y2="190" stroke="#167a72" stroke-width="3"/><polygon points="855,190 843.12984377594,195.3008858897744 843.12984377594,184.6991141102256" fill="#167a72"/><rect x="875" y="150" width="350" height="80" fill="#f8fafb" stroke="#167a72" stroke-width="2"/><text x="900" y="202" fill="#167a72" font-size="34" font-family="BVP,Arial" font-weight="700" >ReLU: h₂</text><line x1="1230" y1="190" x2="1360" y2="125" stroke="#167a72" stroke-width="3"/><polygon points="1360,125 1351.7536377498848,135.0497517203101 1347.0123812736829,125.56723876790606" fill="#167a72"/><text x="1380" y="136" fill="#167a72" font-size="38" font-family="BVP,Arial" font-weight="700" >(h₁,h₂)</text><text x="20" y="285" fill="#627886" font-size="30" font-family="BVP,Arial" font-weight="400" >Hai nhánh song song, dùng tổng chung và khác bias.</text></svg></figure><div class="columns" style="grid-template-columns:1fr 1fr"><div><div class="equation"><span data-tex="h_1=\mathrm{ReLU}(x_1+x_2)"></span></div></div><div><div class="equation"><span data-tex="h_2=\mathrm{ReLU}(x_1+x_2-1)"></span></div></div></div><p class="takeaway">Cho trước trọng số để khảo sát khả năng biểu diễn. Chưa tuyên bố thuật toán đã học được chúng.</p></div><footer class="foot"><span>Bài 10 · MLP và học biểu diễn</span><span>PGS.TS. Nguyễn Văn Hậu</span><span>13 / 87</span></footer></main><script>window.mathErrors=[];document.querySelectorAll("[data-tex]").forEach(e=>{try{katex.render(e.dataset.tex,e,{throwOnError:true})}catch(x){window.mathErrors.push(String(x))}})</script></body></html>
