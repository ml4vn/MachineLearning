<!doctype html><html lang="vi"><head><meta charset="utf-8"><title>Thêm lớp affine và vai trò hàm phi tuyến</title><link rel="stylesheet" href="../theme.css"><link rel="stylesheet" href="../assets/katex/dist/katex.min.css"><script src="../assets/katex/dist/katex.min.js"></script></head><body><main class="slide normal s10"><div class="meta">BÀI 10 V4 · CHẶNG 1/5</div><h1>Thêm lớp affine và vai trò hàm phi tuyến</h1><p class="essence">Độ sâu cần đi cùng phép biến đổi phi tuyến trong ví dụ này.</p><div class="content"><figure data-science-diagram="affine_composition"><svg class="evidence" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1740 210"><text x="16" y="65" fill="#245a84" font-size="32" font-family="BVP,Arial" font-weight="700" >x</text><line x1="16" y1="88" x2="373" y2="88" stroke="#167a72" stroke-width="3"/><line x1="390" y1="55" x2="430" y2="55" stroke="#bc761a" stroke-width="3"/><polygon points="430,55 418.12984377594,60.30088588977441 418.12984377594,49.69911411022559" fill="#bc761a"/><text x="451" y="65" fill="#245a84" font-size="32" font-family="BVP,Arial" font-weight="700" >W₁x+b₁</text><line x1="451" y1="88" x2="808" y2="88" stroke="#167a72" stroke-width="3"/><line x1="825" y1="55" x2="865" y2="55" stroke="#bc761a" stroke-width="3"/><polygon points="865,55 853.12984377594,60.30088588977441 853.12984377594,49.69911411022559" fill="#bc761a"/><text x="886" y="65" fill="#245a84" font-size="32" font-family="BVP,Arial" font-weight="700" >W₂(…)+b₂</text><line x1="886" y1="88" x2="1243" y2="88" stroke="#167a72" stroke-width="3"/><line x1="1260" y1="55" x2="1300" y2="55" stroke="#bc761a" stroke-width="3"/><polygon points="1300,55 1288.12984377594,60.30088588977441 1288.12984377594,49.69911411022559" fill="#bc761a"/><text x="1321" y="65" fill="#245a84" font-size="32" font-family="BVP,Arial" font-weight="700" >Một affine gộp</text><line x1="1321" y1="88" x2="1678" y2="88" stroke="#167a72" stroke-width="3"/><text x="16" y="170" fill="#627886" font-size="30" font-family="BVP,Arial" font-weight="400" >Khai triển biểu thức để nhìn thấy tham số có thể gộp.</text></svg></figure><div class="equation"><span data-tex="W_2(W_1x+b_1)+b_2=(W_2W_1)x+(W_2b_1+b_2)"></span></div><p class="takeaway">Ghép nhiều lớp affine vẫn cho một phép affine. Kích hoạt giữa các lớp thay đổi họ biểu diễn.</p></div><footer class="foot"><span>Bài 10 · MLP và học biểu diễn</span><span>PGS.TS. Nguyễn Văn Hậu</span><span>10 / 87</span></footer></main><script>window.mathErrors=[];document.querySelectorAll("[data-tex]").forEach(e=>{try{katex.render(e.dataset.tex,e,{throwOnError:true})}catch(x){window.mathErrors.push(String(x))}})</script></body></html>
