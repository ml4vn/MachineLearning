<!doctype html><html lang="vi"><head><meta charset="utf-8"><title>Một nơ-ron: tổng có trọng số và hàm kích hoạt</title><link rel="stylesheet" href="../theme.css"><link rel="stylesheet" href="../assets/katex/dist/katex.min.css"><script src="../assets/katex/dist/katex.min.js"></script></head><body><main class="slide normal s7"><div class="meta">BÀI 10 V4 · CHẶNG 1/5</div><h1>Một nơ-ron: tổng có trọng số và hàm kích hoạt</h1><p class="essence">Nơ-ron kết hợp đầu vào rồi áp dụng hàm kích hoạt.</p><div class="content"><figure data-science-diagram="neuron"><svg class="evidence" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1740 210"><text x="16" y="65" fill="#245a84" font-size="32" font-family="BVP,Arial" font-weight="700" >x₁, x₂, …</text><line x1="16" y1="88" x2="373" y2="88" stroke="#167a72" stroke-width="3"/><line x1="390" y1="55" x2="430" y2="55" stroke="#bc761a" stroke-width="3"/><polygon points="430,55 418.12984377594,60.30088588977441 418.12984377594,49.69911411022559" fill="#bc761a"/><text x="451" y="65" fill="#245a84" font-size="32" font-family="BVP,Arial" font-weight="700" >Nhân w tương ứng</text><line x1="451" y1="88" x2="808" y2="88" stroke="#167a72" stroke-width="3"/><line x1="825" y1="55" x2="865" y2="55" stroke="#bc761a" stroke-width="3"/><polygon points="865,55 853.12984377594,60.30088588977441 853.12984377594,49.69911411022559" fill="#bc761a"/><text x="886" y="65" fill="#245a84" font-size="32" font-family="BVP,Arial" font-weight="700" >Tổng tích + bias: z</text><line x1="886" y1="88" x2="1243" y2="88" stroke="#167a72" stroke-width="3"/><line x1="1260" y1="55" x2="1300" y2="55" stroke="#bc761a" stroke-width="3"/><polygon points="1300,55 1288.12984377594,60.30088588977441 1288.12984377594,49.69911411022559" fill="#bc761a"/><text x="1321" y="65" fill="#245a84" font-size="32" font-family="BVP,Arial" font-weight="700" >ReLU: h</text><line x1="1321" y1="88" x2="1678" y2="88" stroke="#167a72" stroke-width="3"/><text x="16" y="170" fill="#627886" font-size="30" font-family="BVP,Arial" font-weight="400" >Đầu vào → tổng trước kích hoạt → giá trị sau kích hoạt.</text></svg></figure><div class="equation"><span data-tex="z=\sum_k w_kx_k+b,\qquad h=\mathrm{ReLU}(z)"></span></div><p class="takeaway">z: tổng trước kích hoạt. h: giá trị sau kích hoạt. Trọng số và bias là tham số học.</p></div><footer class="foot"><span>Bài 10 · MLP và học biểu diễn</span><span>PGS.TS. Nguyễn Văn Hậu</span><span>7 / 87</span></footer></main><script>window.mathErrors=[];document.querySelectorAll("[data-tex]").forEach(e=>{try{katex.render(e.dataset.tex,e,{throwOnError:true})}catch(x){window.mathErrors.push(String(x))}})</script></body></html>
