<!doctype html><html lang="vi"><head><meta charset="utf-8"><title>Gradient đầu ra khi có 10 lớp</title><link rel="stylesheet" href="../theme.css"><link rel="stylesheet" href="../assets/katex/dist/katex.min.css"><script src="../assets/katex/dist/katex.min.js"></script></head><body><main class="slide normal s65"><div class="meta">BÀI 10 V4 · CHẶNG 4/5</div><h1>Gradient đầu ra khi có 10 lớp</h1><p class="essence">Tín hiệu đầu ra mở rộng thành vector trước khi đi về lớp ẩn.</p><div class="content"><div class="columns" style="grid-template-columns:1fr 1fr"><div><table class="compact"><thead><tr><th>Nhị phân</th><th>Mười lớp loại trừ</th></tr></thead><tbody><tr><td>Một xác suất p</td><td>Vector mười xác suất p</td></tr><tr><td>y∈{0,1}</td><td>Chỉ số y và one-hot eᵧ</td></tr><tr><td>δ=p−y</td><td>δ=p−eᵧ</td></tr></tbody></table></div><div><figure data-science-diagram="multiclass_delta"><svg class="evidence" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 385"><text x="20" y="45" fill="#132c3f" font-size="33" font-family="BVP,Arial" font-weight="700" >Minh họa 3 lớp, y=1</text><text x="20" y="125" fill="#245a84" font-size="33" font-family="BVP,Arial" font-weight="700" >δ0 = 0,665 − 0 = 0,665</text><text x="20" y="220" fill="#bc761a" font-size="33" font-family="BVP,Arial" font-weight="700" >δ1 = 0,245 − 1 = -0,755</text><text x="20" y="315" fill="#245a84" font-size="33" font-family="BVP,Arial" font-weight="700" >δ2 = 0,090 − 0 = 0,090</text></svg></figure></div></div><div class="equation"><span data-tex="\frac{\partial\ell}{\partial s_k}=p_k-(e_y)_k,\qquad \sum_k\delta_k=0"></span></div></div><footer class="foot"><span>Bài 10 · MLP và học biểu diễn</span><span>PGS.TS. Nguyễn Văn Hậu</span><span>65 / 87</span></footer></main><script>window.mathErrors=[];document.querySelectorAll("[data-tex]").forEach(e=>{try{katex.render(e.dataset.tex,e,{throwOnError:true})}catch(x){window.mathErrors.push(String(x))}})</script></body></html>
