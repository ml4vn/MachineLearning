<svg class="evidence" xmlns="http://www.w3.org/2000/svg" viewbox="0 0 1740 210"><style><![CDATA[*{box-sizing:border-box}body{font:19px/1.7 "Segoe UI",Arial,sans-serif;color:#132c3f;max-width:1160px;margin:36px auto;padding:0 24px}h1,h2,h3{color:#245a84}h2{border-top:3px solid #167a72;padding-top:16px;margin-top:36px}table{border-collapse:collapse;width:100%;margin:22px 0;font-size:18px}th,td{border-bottom:1px solid #c5d5dc;padding:12px;text-align:left;vertical-align:top;overflow-wrap:anywhere}th{background:#e4edf1}tr:nth-child(even){background:#f0f5f7}a{color:#245a84;overflow-wrap:anywhere}pre{background:#eef4f7;padding:18px;white-space:pre-wrap;overflow-wrap:anywhere}code{font-family:Consolas,monospace}strong{color:#167a72}.note{border-left:4px solid #bc761a;padding:12px 18px;background:#fcf6ec}img{max-width:100%;height:auto}.wrap{overflow-x:auto;position:relative;contain:paint}p,li{overflow-wrap:anywhere}.evidence{display:block;width:100%;height:auto}.equation{text-align:center;font-size:22px;margin:24px 0;overflow-x:auto}details{margin:20px 0;padding:15px;background:#f0f5f7}summary{cursor:pointer;color:#167a72;font-weight:600}button,input,select{font:inherit;padding:8px 12px;max-width:100%}.controls{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin:18px 0}#slideimg{border:1px solid #c5d5dc}#notes{background:#f0f5f7;padding:20px;white-space:pre-line;overflow-wrap:anywhere}svg text{font-family:"Segoe UI",Arial,sans-serif}@media(max-width:650px){body{font-size:17px;padding:0 16px}.wrap table{min-width:560px}h1{font-size:28px}}@media print{body{max-width:none;margin:0;font-size:12pt}details>*{display:block}h2{break-after:avoid}table,img{break-inside:avoid}}]]></style><text x="16" y="65" fill="#75b9e4" font-size="32" font-family="BVP,Arial" font-weight="700">Train cập nhật</text><line x1="16" y1="88" x2="373" y2="88" stroke="#50c5b5" stroke-width="3"></line><line x1="390" y1="55" x2="430" y2="55" stroke="#f0bc6b" stroke-width="3"></line><polygon points="430,55 418.12984377594,60.30088588977441 418.12984377594,49.69911411022559" fill="#f0bc6b"></polygon><text x="451" y="65" fill="#75b9e4" font-size="32" font-family="BVP,Arial" font-weight="700">Validation đo CE</text><line x1="451" y1="88" x2="808" y2="88" stroke="#50c5b5" stroke-width="3"></line><line x1="825" y1="55" x2="865" y2="55" stroke="#f0bc6b" stroke-width="3"></line><polygon points="865,55 853.12984377594,60.30088588977441 853.12984377594,49.69911411022559" fill="#f0bc6b"></polygon><text x="886" y="65" fill="#75b9e4" font-size="32" font-family="BVP,Arial" font-weight="700">Lưu checkpoint</text><line x1="886" y1="88" x2="1243" y2="88" stroke="#50c5b5" stroke-width="3"></line><line x1="1260" y1="55" x2="1300" y2="55" stroke="#f0bc6b" stroke-width="3"></line><polygon points="1300,55 1288.12984377594,60.30088588977441 1288.12984377594,49.69911411022559" fill="#f0bc6b"></polygon><text x="1321" y="65" fill="#75b9e4" font-size="32" font-family="BVP,Arial" font-weight="700">Test báo cáo</text><line x1="1321" y1="88" x2="1678" y2="88" stroke="#50c5b5" stroke-width="3"></line><text x="16" y="170" fill="#bdd1dd" font-size="30" font-family="BVP,Arial" font-weight="400">Chọn theo validation; giữ seed chính và quyết định trước khi đo test.</text></svg>