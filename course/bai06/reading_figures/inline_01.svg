<svg class="evidence" xmlns="http://www.w3.org/2000/svg" viewbox="0 0 850 420"><style><![CDATA[*{box-sizing:border-box}body{font:19px/1.7 "Segoe UI",Arial,sans-serif;color:#132c3f;max-width:1160px;margin:36px auto;padding:0 24px}h1,h2,h3{color:#245a84}h2{border-top:3px solid #167a72;padding-top:16px;margin-top:36px}table{border-collapse:collapse;width:100%;margin:22px 0;font-size:18px}th,td{border-bottom:1px solid #c5d5dc;padding:12px;text-align:left;vertical-align:top;overflow-wrap:anywhere}th{background:#e4edf1}tr:nth-child(even){background:#f0f5f7}a{color:#245a84;overflow-wrap:anywhere}pre{background:#eef4f7;padding:18px;white-space:pre-wrap;overflow-wrap:anywhere}code{font-family:Consolas,monospace}strong{color:#167a72}.note{border-left:4px solid #bc761a;padding:12px 18px;background:#fcf6ec}img{max-width:100%;height:auto}.wrap{overflow-x:auto}p,li{overflow-wrap:anywhere}.evidence{display:block;width:100%;height:auto}.equation{text-align:center;font-size:22px;margin:24px 0;overflow-x:auto}details{margin:20px 0;padding:15px;background:#f0f5f7}summary{cursor:pointer;color:#167a72;font-weight:600}button,input,select{font:inherit;padding:8px 12px;max-width:100%}.controls{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin:18px 0}#slideimg{border:1px solid #c5d5dc}#notes{background:#f0f5f7;padding:20px;white-space:pre-line}@media(max-width:650px){body{font-size:17px;padding:0 16px}.wrap table{min-width:560px}h1{font-size:28px}}@media print{body{max-width:none;margin:0;font-size:12pt}details>*{display:block}h2{break-after:avoid}table,img{break-inside:avoid}}#notes{overflow-wrap:anywhere}]]></style><rect x="285" y="20" width="275" height="78" fill="#f8fafb" stroke="#132c3f" stroke-width="1.5"></rect><text x="300" y="51" fill="#132c3f" font-size="25" font-family="BVP,Arial" font-weight="700">h ≤ 15 ngày?</text><text x="300" y="80" fill="#132c3f" font-size="25" font-family="BVP,Arial" font-weight="400">n=12 · 6 trễ</text><line x1="350" y1="100" x2="165" y2="196" stroke="#245a84" stroke-width="3"></line><polygon points="165,196 171.5879138446108,187.19094833844272 175.99548013071492,195.68469586895583" fill="#245a84"></polygon><line x1="490" y1="100" x2="630" y2="151" stroke="#bc761a" stroke-width="3"></line><polygon points="630,151 619.0556764949025,152.10534294034525 622.3310545437133,143.11410908086478" fill="#bc761a"></polygon><text x="230" y="153" fill="#627886" font-size="23" font-family="BVP,Arial" font-weight="400">Đúng</text><text x="590" y="124" fill="#627886" font-size="23" font-family="BVP,Arial" font-weight="400">Sai</text><rect x="40" y="200" width="255" height="80" fill="#f8fafb" stroke="#bc761a" stroke-width="1.5"></rect><text x="55" y="231" fill="#bc761a" font-size="25" font-family="BVP,Arial" font-weight="700">L1 · n=4 · p=1</text><text x="55" y="260" fill="#bc761a" font-size="25" font-family="BVP,Arial" font-weight="400">4 trễ / 4 mẫu</text><rect x="490" y="155" width="300" height="86" fill="#f8fafb" stroke="#132c3f" stroke-width="1.5"></rect><text x="505" y="186" fill="#132c3f" font-size="25" font-family="BVP,Arial" font-weight="700">Nút phải / lá gộp</text><text x="505" y="215" fill="#132c3f" font-size="25" font-family="BVP,Arial" font-weight="400">p=2/8=0,25</text></svg>