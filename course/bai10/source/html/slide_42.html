 >θ₇</text><rect x="1336" y="55" width="160" height="90" fill="#f8fafb" stroke="#c7d6df" stroke-width="2"/><text x="1356" y="113" fill="#132c3f" font-size="34" font-family="BVP,Arial" font-weight="700" >θ₈</text><rect x="1524" y="55" width="160" height="90" fill="#f8fafb" stroke="#c7d6df" stroke-width="2"/><text x="1544" y="113" fill="#132c3f" font-size="34" font-family="BVP,Arial" font-weight="700" >θ₉</text><text x="20" y="230" fill="#bc761a" font-size="34" font-family="BVP,Arial" font-weight="700" >Chỉ θ₂ thay đổi trong đạo hàm riêng thứ hai</text><text x="20" y="305" fill="#627886" font-size="31" font-family="BVP,Arial" font-weight="400" >Gom chín đạo hàm riêng thành gradient theo cùng thứ tự θ</text></svg></figure><div class="equation"><span data-tex="\nabla_\theta\ell=\left(\frac{\partial\ell}{\partial\theta_1},\ldots,\frac{\partial\ell}{\partial\theta_9}\right)"></span></div><p class="takeaway">Một đạo hàm riêng thay một tham số và giữ các tham số khác cố định.</p></div><footer class="foot"><span>Bài 10 · MLP và học biểu diễn</span><span>PGS.TS. Nguyễn Văn Hậu</span><span>42 / 87</span></footer></main><script>window.mathErrors=[];document.querySelectorAll("[data-tex]").forEach(e=>{try{katex.render(e.dataset.tex,e,{throwOnError:true})}catch(x){window.mathErrors.push(String(x))}})</script></body></html>
