name: Python teaching labs

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  examples:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      PYTHONUTF8: '1'
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements-v4.txt
      - name: Check dependency consistency
        run: python -m pip check
      - name: Check readings and course links
        run: python tools/check_course.py
      - name: Check v4 readings, resources, notebooks and slide notes
        run: python tools/check_v4.py
      - name: Check v4 Markdown matches full HTML source
        run: python tools/build_v4_readings.py --check
      - name: Mathematical and edge-case tests
        env:
          MPLCONFIGDIR: ${{ runner.temp }}/matplotlib
        run: python run_tests.py
      - name: Run all ten small examples sequentially
        env:
          MPLCONFIGDIR: ${{ runner.temp }}/matplotlib
        run: python run_all.py --mode toy --dpi 80
      - name: Independently check stored v4 scientific evidence
        env:
          MPLCONFIGDIR: ${{ runner.temp }}/matplotlib
        run: python v4/run_labs.py --audit-only
